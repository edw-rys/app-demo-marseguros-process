[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ── Web ────────────────────────────────────────────────────────────────────
; php-fpm primero (es al que nginx le habla) y nginx después (necesita que el
; socket exista para no fallar en el arranque).

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
autostart=true
autorestart=true
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

; ── Cola ───────────────────────────────────────────────────────────────────
; `ProcessEmailJob` es ShouldQueue y va a la cola `pipeline`. Con
; QUEUE_CONNECTION=sync despacharlo ya lo ejecuta, y este proceso no hace falta
; — pero con `database` sí, así que corre siempre: en el modo sync no encuentra
; nada y sale limpio.

[program:queue]
command=php /var/www/html/artisan queue:work --queue=pipeline --sleep=3 --tries=1 --max-time=3600
autostart=true
autorestart=true
priority=300
user=www-data
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=30

; ── Gmail ──────────────────────────────────────────────────────────────────
; El polling de Gmail. Corre por defecto: es el único proceso que trae correos
; nuevos al panel, y dejarlo apagado obliga a correr `gmail:sync` a mano.
;
; El `command` es una RUTA, no una línea de shell, y a propósito. Este archivo no
; es un shell: supervisord expande `%` y `$` al leerlo, y `$$` no es un escape de
; `$`. Escribir el bucle acá con `$${GMAIL_POLL_INTERVAL:-120}` arrancaba el
; contenedor y fallaba en bucle con `sleep: invalid number '30{...}'`. Todo el
; shell —incluidas las variables de entorno— vive en `docker/gmail-poll.sh`,
; donde las reglas son las de bash.
;
; `GMAIL_POLL_ENABLED=false` y el intervalo salen de `.env`; los lee el script.
; `--skip-if-unconfigured` hace que el bucle salga en silencio mientras falte la
; credencial, así que en cuanto autorizás Gmail el bucle sigue solo: no hay que
; reiniciar nada.

[program:gmail-poll]
command=/usr/local/bin/gmail-poll.sh
autostart=true
autorestart=true
priority=400
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=30