server {
    listen 8080;
    server_name _;
    root /var/www/html/public;

    charset utf-8;
    client_max_body_size 64M;

    # `public/` es el único directorio expuesto. Todo lo demás — `.env`,
    # `storage/`, `vendor/` — queda fuera por construcción, no por una regla
    # de deny que se pueda olvidar.
    index index.php index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── SSE del pipeline en vivo ─────────────────────────────────────────────
    # Ruta aparte porque nginx bufferiza por defecto: guarda la respuesta en
    # `fastcgi_buffers` (16k) y recién la manda al navegador cuando se llena o
    # termina la petición. Con un stream que manda un evento cada cientos de
    # milisegundos, eso lo convierte en un stream que no llega nunca hasta el
    # final: el panel se vería congelado y después receives todo de golpe.
    location ~ ^/jobs/[^/]+/stream$ {
        # Sin esto nginx busca el archivo en disco y, como `/jobs/{uuid}/stream`
        # no existe como archivo, contesta 404 "File not found." sin llegar
        # nunca a PHP. Es el mismo `try_files` del `location /`, y hace falta
        # repetirlo: las directivas de un `location` no se heredan de otro.
        try_files $uri /index.php$is_args$args;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        include fastcgi_params;

        # Sin buffering: cada `echo` del controller sale hacia el navegador en
        # el acto, que es justamente lo que hace útil el SSE.
        fastcgi_buffering off;
        # `gzip` también acumaría antes de comprimir. Off por lo mismo.
        gzip off;

        # El stream vive hasta que el job termina, no 300s. Este timeout es de
        # INACTIVIDAD entre lecturas de upstream: con un heartbeat cada 15s (ver
        # `JobStreamController`) nunca se llega, y existe solo para que una
        # conexión colgada no retenga un worker de php-fpm para siempre.
        fastcgi_read_timeout 1h;

        # El stream no se cachea: sin esto un proxy intermedio podría guardar
        # la respuesta y reenviarla entera.
        add_header Cache-Control "no-cache, no-store" always;
        add_header X-Accel-Buffering "no" always;
    }

    # En producción Laravel sirve sus assets con nombre hasheado; el bloqueo de
    # `storage` de abajo no los toca porque cuelgan de `/build`.
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        include fastcgi_params;

        # `laravel/framework` con `QUEUE_CONNECTION=sync` puede tardar bastante
        # en un correo con OCR de por medio.
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Symfony sirve los assets de Filament con `immutable`: nunca cambian bajo
    # el mismo nombre, así que se pueden cachear para siempre.
    location ~* ^(/build|/css|/js)/.*\.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\. {
        deny all;
    }
}