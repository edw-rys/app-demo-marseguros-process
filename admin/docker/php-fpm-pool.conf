; Pool de php-fpm.
;
; Va aparte de `php.ini` porque `php.ini` es para INI y `pm.*` son directivas del
; pool: si se escribieran ahí, PHP las ignoraría en silencio y el default (5)
; seguiría mandando.
;
; Se llama `zz-` porque `php-fpm` carga `conf.d` en orden alfabético y el
; `www.conf` de la imagen oficial pisa el pool con 5. Este tiene que cargarse
; DESPUÉS para ganar.

[www]
; El default de la imagen oficial es 5, y con SSE eso se queda corto: cada
; conexión abierta retiene un worker durante toda su vida (no solo mientras
; responde), así que 5 pestañas mirando jobs dejarían el panel sin workers y
; TODAS las páginas se colgarían, no solo las que están mirando un job.
;
; Con 30 el margen aguanta un panel con varios jobs en vivo. No es un número
; arbitrario grande: cada worker es un proceso PHP ocioso que pesa unos pocos MB
; de RSS (el opcache es compartido, no se replica por proceso), y uno en
; streaming está prácticamente inactivo — lo único que hace es dormir un
; intervalo entre eventos. La memoria la fija `memory_limit` en `php.ini`.
pm.max_children = 30

; Una conexión SSE abierta durante minutos es normal y no es una fuga: el worker
; se reutiliza. Estos dos evitan que el proceso se quede dormido tanto que el
; panel note la demora al responder.
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 10

; Sin esto un worker SSE que se cuelgue (navegador que cerró la pestaña sin
; cerrar el stream) queda retenido hasta `request_terminate_timeout`, que en la
; imagen oficial no está puesto: el default es 0 = nunca. Por eso se pone aquí,
; con margen de sobra para el pipeline más largo que exista.
request_terminate_timeout = 600s