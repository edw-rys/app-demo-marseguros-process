; Ajustes para el pipeline de documentos.
;
; Los tiempos son altos a propósito: un correo con 5 adjuntos escaneados pasa
; por Tesseract —y a veces PaddleOCR— y el proceso entero puede acercarse al
; minuto. `ANALYZER_TIMEOUT_SEC` (60) es el timeout del cliente HTTP hacia los
; workers; el de aquí tiene que ser mayor para que PHP no muera primero.

memory_limit = 512M
max_execution_time = 300
post_max_size = 64M
upload_max_filesize = 64M

; Los errores van a stderr, que supervisor manda a los logs del contenedor.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; En desarrollo es cómodo ver el error en la página; en Docker se apaga para no
; filtrar rutas internas en la respuesta.
; display_errors = On

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

date.timezone = UTC